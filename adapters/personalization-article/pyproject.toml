[project]
name = "personalization-article"
version = "0.1.0"
description = "Minimal article domain adapter for personalization-core"
requires-python = ">=3.11"
dependencies = [
    "personalization-core>=0.1,<0.2",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalization_article"]

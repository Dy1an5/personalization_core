services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personalization
      POSTGRES_USER: personalization
      POSTGRES_PASSWORD: personalization
    volumes:
      - personalization-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalization -d personalization"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://personalization:personalization@postgres:5432/personalization
      ALEMBIC_DATABASE_URL: postgresql+psycopg://personalization:personalization@postgres:5432/personalization
      API_KEY: local-development-key
      API_TENANT_ID: local-development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  personalization-postgres:
